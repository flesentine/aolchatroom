<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>People Connection - Town Square</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/chat-authentic.css">
</head>
<body>
  <main class="desktop">
    <section class="aol-shell" aria-label="1996 online chat recreation">
      <header class="app-titlebar">
        <div class="brand-orb" aria-hidden="true"><span>A</span></div>
        <strong>America Online</strong>
        <div class="window-controls" aria-hidden="true"><button tabindex="-1">_</button><button tabindex="-1">□</button><button tabindex="-1">×</button></div>
      </header>

      <nav class="menu-bar" aria-label="Application menu">
        <button>File</button><button>Edit</button><button>Mail</button><button>People</button><button>Places</button><button>Services</button><button>Window</button><button>Help</button>
      </nav>

      <nav class="toolbar" aria-label="AOL toolbar">
        <button class="tool welcome"><span class="tool-icon icon-welcome" aria-hidden="true"></span><span>Welcome</span></button>
        <button class="tool mail"><span class="tool-icon icon-mail" aria-hidden="true"></span><span>Mail</span></button>
        <button class="tool people"><span class="tool-icon icon-people" aria-hidden="true"></span><span>People</span></button>
        <button class="tool places"><span class="tool-icon icon-places" aria-hidden="true"></span><span>Places</span></button>
        <button class="tool services"><span class="tool-icon icon-services" aria-hidden="true"></span><span>Services</span></button>
        <button class="tool help"><span class="tool-icon icon-help" aria-hidden="true">?</span><span>Help</span></button>
        <div class="toolbar-spacer"></div>
        <label class="keyword"><span>Keyword:</span><input value="People Connection" readonly></label>
      </nav>

      <section class="chat-window">
        <header class="chat-titlebar">
          <span class="mini-aol" aria-hidden="true">A</span>
          <span>People Connection: Town Square</span>
          <div class="window-controls" aria-hidden="true"><button tabindex="-1">_</button><button tabindex="-1">□</button><button tabindex="-1">×</button></div>
        </header>

        <div class="chat-menu-strip">
          <button>More Chat</button>
          <button>Private Chat</button>
          <button>Chat Preferences</button>
          <button>Notify AOL</button>
          <button>Member Directory</button>
        </div>

        <div class="room-body">
          <section class="transcript-wrap">
            <div class="pane-caption">Room Conversation</div>
            <div id="transcript" class="transcript" role="log" aria-live="polite"></div>

            <div class="format-strip" aria-hidden="true">
              <label>Font <select tabindex="-1"><option>Arial</option></select></label>
              <label>Size <select tabindex="-1"><option>10</option></select></label>
              <button tabindex="-1"><b>B</b></button>
              <button tabindex="-1"><i>I</i></button>
              <button tabindex="-1"><u>U</u></button>
              <span class="format-separator"></span>
              <span class="color-chip"></span>
            </div>

            <div class="composer">
              <textarea id="message" maxlength="320" aria-label="Message"></textarea>
              <button id="send">Send</button>
            </div>
          </section>

          <aside class="people-panel">
            <div class="panel-title"><span>People Here</span><span class="count-badge" id="count">0</span></div>
            <select id="people" size="18" aria-label="People Here"></select>
            <div class="people-actions">
              <button>Private</button>
              <button id="profileButton">Profile</button>
              <button>Ignore</button>
              <button>Locate</button>
            </div>
          </aside>
        </div>

        <div id="debugPanel" class="debug-panel hidden" aria-live="polite"></div>

        <footer class="statusbar">
          <span class="status-cell" id="status">Connecting...</span>
          <span class="status-cell status-room">Town Square</span>
          <span class="status-cell status-clock" id="clock">November 22, 1996</span>
        </footer>
      </section>
    </section>

    <section id="signin" class="signin-card">
      <div class="signin-title">
        <span class="mini-aol" aria-hidden="true">A</span><span>Sign On</span>
        <div class="window-controls" aria-hidden="true"><button tabindex="-1">×</button></div>
      </div>
      <div class="signin-inner">
        <div class="signin-banner" aria-hidden="true"><span class="signin-mark">A</span><span class="signin-copy">America Online</span></div>
        <label>Screen Name <input id="screenName" maxlength="16" autocomplete="nickname"></label>
        <button id="signOn">Sign On</button>
        <small>This is an AI-powered fan recreation, not AOL.</small>
        <small>Room memory may retain non-sensitive preferences tied to your screen name.</small>
      </div>
    </section>

    <section id="profileDialog" class="profile-dialog hidden" role="dialog" aria-modal="true" aria-labelledby="profileTitle">
      <div class="signin-title">
        <span class="mini-aol" aria-hidden="true">A</span><span id="profileTitle">Member Profile</span>
        <div class="window-controls"><button id="closeProfile" aria-label="Close">×</button></div>
      </div>
      <div id="profileBody" class="profile-body"></div>
      <div class="profile-actions"><button id="closeProfileBottom">OK</button></div>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
