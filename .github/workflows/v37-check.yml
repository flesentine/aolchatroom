name: v37 conversation director

on:
  push:
    branches:
      - 'v37-*'
  pull_request:
    branches:
      - main

jobs:
  v37-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run full regression suite
        run: npm run check
