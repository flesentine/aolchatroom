name: Apply conversation director

on:
  push:
    paths:
      - '.github/workflows/apply-conversation-director.yml'
      - 'scripts/apply_conversation_director.py'
      - 'src/director.js'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply conversation director patch
        run: python3 scripts/apply_conversation_director.py

      - name: Check JavaScript syntax
        run: npm run check

      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.js public/app.js package.json README.md
          git commit -m "Make room conversations deeper and more social"
          git push
