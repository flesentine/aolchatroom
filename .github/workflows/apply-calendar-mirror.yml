name: Apply calendar mirror

on:
  push:
    paths:
      - '.github/workflows/apply-calendar-mirror.yml'
      - 'scripts/apply_calendar_mirror.py'
      - 'src/calendar.js'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply mirror-calendar patch
        run: python3 scripts/apply_calendar_mirror.py

      - name: Check JavaScript syntax
        run: npm run check

      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/social.js src/index.js package.json README.md
          git commit -m "Sync 1996 world to live calendar and holidays"
          git push
